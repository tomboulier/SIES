[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sies"
version = "1.0.0"
description = "Shape Identification in Electro-Sensing: generalized polarization tensors, dictionary matching and target tracking"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Han Wang (original MATLAB library)" },
    { name = "Thomas Boulier", email = "boulier.thomas@gmail.com" },
]
keywords = [
    "inverse-problems",
    "electro-sensing",
    "polarization-tensors",
    "shape-identification",
    "boundary-integral-equations",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/tomboulier/SIES"
Documentation = "https://tomboulier.github.io/SIES/"
Repository = "https://github.com/tomboulier/SIES"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "marimo>=0.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "e2e: end-to-end tests (slower, full pipeline)",
]

[tool.coverage.run]
source = ["sies"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
]
ignore = [
    "D105", # missing docstring in magic method
    "D107", # missing docstring in __init__ (documented at class level)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Marimo cells receive other cells' variables (including classes) as
# function arguments, which trips the naming rules.
"notebooks/**" = ["D", "B018", "N", "RUF001"]
"scripts/**" = ["D"]
